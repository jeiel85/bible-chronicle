name: Validate bible content manifests
on:
  push:
    paths:
      - 'data/**'
      - 'schemas/**'
      - 'scripts/**'
      - '.github/workflows/validate-content.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'schemas/**'
      - 'scripts/**'
      - '.github/workflows/validate-content.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema>=4,<5'
      - run: python scripts/validate_package.py
      - run: python scripts/validate_israel_campaign.py
