const byChapter=new Map(data.chapters.map(x=>[x.chapter,x]));const cardMap=new Map(data.cards.map(x=>[x.ref,x]));const chs=document.getElementById('ch'),vs=document.getElementById('v'),search=document.getElementById('search');
function el(id){return document.getElementById(id)}function set(id,txt){el(id).textContent=txt}for(let i=1;i<=50;i++){const o=document.createElement('option');o.value=i;o.textContent=`창세기 ${i}장`;chs.append(o)}
function selectCh(ch,verse=1){chs.value=ch;vs.replaceChildren();for(const x of data.cards.filter(x=>x.chapter===Number(ch))){const o=document.createElement('option');o.value=x.verse;o.textContent=`${x.verse}절`;vs.append(o)}vs.value=verse;paint()}
function nodeText(parent,tag,t,cls){const x=document.createElement(tag);x.textContent=t;if(cls)x.className=cls;parent.append(x);return x}
